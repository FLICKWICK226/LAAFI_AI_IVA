# ==========================================
# ⚙️ CONFIGURATION GLOBALE - LAAFI_AI IVA
# ==========================================

project:
  name: "LAAFI_AI_IVA"
  version: "2.0"
  seed: 42

paths:
  raw_data_dir: "./data/raw"
  synthetic_masks_dir: "./data/synthetic_masks"
  processed_data_dir: "./data/processed"
  checkpoints_dir: "./models/checkpoints"
  exported_dir: "./models/exported"
  outputs_dir: "./outputs"
  figures_dir: "./outputs/figures"
  reports_dir: "./outputs/reports"
  logs_dir: "./outputs/logs"

dataset:
  kaggle_dataset: "intel-mobileodt-cervical-cancer-screening"
  img_size: [384, 384]
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  num_perlin_masks: 1000

stage1_yolo:
  model_type: "yolov8n-det" # ou yolov11n-det
  epochs: 50
  batch_size: 16
  img_size: 640
  confidence_threshold: 0.25

stage2_classifier:
  backbone: "convnext_small" # ou convnext_base, efficientnet_b3 (3x plus rapide sur T4)
  num_classes: 2
  epochs: 25
  batch_size: 16   # Grâce à convnext_small, batch_size=16 passe sans OOM sur T4
  gradient_accumulation_steps: 1
  warmup_epochs: 2  # Warmup réduit à 2 époques
  early_stopping_patience: 5
  learning_rate: 1.0e-4        # LR Backbone pré-entraîné
  head_learning_rate: 1.0e-3   # LR Têtes de classification (10x plus élevé pour convergence rapide)
  weight_decay: 1.0e-4         # Régularisation modérée
  drop_rate: 0.2               # Dropout optimisé pour éviter le sous-apprentissage
  asl_gamma_pos: 1.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
  threshold_calibration:
    min_t: 0.10
    max_t: 0.90
    step: 0.01
    target_recall: 0.95
  tri_class_triage:
    green_max: 0.20   # P < 0.20 -> Vert (Négatif, contrôle 3 ans)
    yellow_max: 0.38  # 0.20 <= P < 0.38 -> Jaune (Incertain, 2nd badigeon / 2e avis)
    red_min: 0.38     # P >= 0.38 -> Rouge (Positif, référer / traitement)

augmentations:
  hue_shift_limit: 0.05
  sat_shift_limit: 0.20
  val_shift_limit: 0.25
  defocus_radius: [1, 4]
  motion_blur_limit: [3, 9]
  perlin_noise_proba: 0.30
  specular_flare_proba: 0.40  # Simulation des reflets spéculaires intenses de flash LED

