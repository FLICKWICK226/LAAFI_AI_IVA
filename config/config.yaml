# ==========================================
# ⚙️ CONFIGURATION GLOBALE - LAAFI_AI IVA
# ==========================================

project:
  name: "LAAFI_AI_IVA"
  version: "2.0"
  seed: 42

paths:
  raw_data_dir: "./data/raw"
  synthetic_masks_dir: "./data/synthetic_masks"
  processed_data_dir: "./data/processed"
  checkpoints_dir: "./models/checkpoints"
  exported_dir: "./models/exported"
  outputs_dir: "./outputs"
  figures_dir: "./outputs/figures"
  reports_dir: "./outputs/reports"
  logs_dir: "./outputs/logs"

dataset:
  kaggle_dataset: "intel-mobileodt-cervical-cancer-screening"
  img_size: [224, 224] # Format 224x224 optimal (5x plus rapide sur T4)
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  num_perlin_masks: 1000

stage1_yolo:
  model_type: "yolov8n-det"
  epochs: 50
  batch_size: 16
  img_size: 640
  confidence_threshold: 0.25

stage2_classifier:
  backbone: "convnext_small" # ou mobilenetv4_conv_medium, efficientnet_b0
  num_classes: 3   # Tri-classes : Type 1 (0), Type 2 (1), Type 3 (2)
  epochs: 20
  batch_size: 32   # Batch size 32 sur 224x224 passe parfaitement sans OOM
  gradient_accumulation_steps: 1
  warmup_epochs: 2
  early_stopping_patience: 5
  learning_rate: 1.0e-4        # LR Backbone pré-entraîné
  head_learning_rate: 1.0e-3   # LR Têtes de classification (10x plus élevé pour convergence rapide)
  weight_decay: 1.0e-4         # Régularisation modérée
  drop_rate: 0.2               # Dropout optimisé
  loss_type: "cross_entropy"   # Multi-classes standard pour l'éligibilité anatomique

augmentations:
  hue_shift_limit: 0.05
  sat_shift_limit: 0.20
  val_shift_limit: 0.25
  defocus_radius: [1, 4]
  motion_blur_limit: [3, 9]
  perlin_noise_proba: 0.30
  specular_flare_proba: 0.40  # Simulation des reflets spéculaires intenses de flash LED

