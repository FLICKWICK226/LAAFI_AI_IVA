# ==========================================
# ⚙️ CONFIGURATION GLOBALE - LAAFI_AI IVA
# ==========================================

project:
  name: "LAAFI_AI_IVA"
  version: "2.0"
  seed: 42

paths:
  raw_data_dir: "./data/raw"
  synthetic_masks_dir: "./data/synthetic_masks"
  processed_data_dir: "./data/processed"
  checkpoints_dir: "./models/checkpoints"
  exported_dir: "./models/exported"
  outputs_dir: "./outputs"
  figures_dir: "./outputs/figures"
  reports_dir: "./outputs/reports"
  logs_dir: "./outputs/logs"

dataset:
  kaggle_dataset: "intel-mobileodt-cervical-cancer-screening"
  img_size: [384, 384]
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  num_perlin_masks: 1000

stage1_yolo:
  model_type: "yolov8n-det" # ou yolov11n-det
  epochs: 50
  batch_size: 16
  img_size: 640
  confidence_threshold: 0.25

stage2_classifier:
  backbone: "convnext_base"
  num_classes: 2
  epochs: 30
  batch_size: 8   # Réduit à 8 pour garantir < 8 Go VRAM sur GPU T4 (Evite CUDA OOM)
  gradient_accumulation_steps: 2  # Batch size effectif = 8 * 2 = 16
  warmup_epochs: 3  # Levier 5 : Backbone gelé pendant 3 epochs
  early_stopping_patience: 4  # Early stopping déclenché si 4 epochs sans amélioration (Epoch 25 optimal)
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3  # Régularisation AdamW renforcée (1e-3)
  drop_rate: 0.4  # Dropout augmenté à 0.4 pour contrer le surapprentissage
  focal_loss_gamma: 2.0
  focal_loss_alpha: 0.75
  threshold_calibration:
    min_t: 0.10
    max_t: 0.90
    step: 0.01
    target_recall: 0.95
  tri_class_triage:
    green_max: 0.20   # P < 0.20 -> Vert (Négatif, contrôle 3 ans)
    yellow_max: 0.38  # 0.20 <= P < 0.38 -> Jaune (Incertain, 2nd badigeon / 2e avis)
    red_min: 0.38     # P >= 0.38 -> Rouge (Positif, référer / traitement)

augmentations:
  hue_shift_limit: 0.05
  sat_shift_limit: 0.20
  val_shift_limit: 0.25
  defocus_radius: [1, 4]
  motion_blur_limit: [3, 9]
  perlin_noise_proba: 0.30
  specular_flare_proba: 0.40  # Simulation des reflets spéculaires intenses de flash LED

